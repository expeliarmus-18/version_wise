spring:
  application:
    name: versionwise-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/versionwise}
    username: ${DB_USERNAME:versionwise_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  security:
      jwt-secret: ${JWT_SECRET:}